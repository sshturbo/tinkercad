<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- App Base Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#334155" stroke-width="1.5" />
  
  <!-- Outer Circuit Traces -->
  <path d="M 8 32 H 18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 46 32 H 56" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 32 8 V 18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 32 46 V 56" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Corner Traces -->
  <path d="M 12 12 L 20 20" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 52 12 L 44 20" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 12 52 L 20 44" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 52 52 L 44 44" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  
  <circle cx="12" cy="12" r="2" fill="#38bdf8" />
  <circle cx="52" cy="12" r="2" fill="#38bdf8" />
  <circle cx="12" cy="52" r="2" fill="#38bdf8" />
  <circle cx="52" cy="52" r="2" fill="#38bdf8" />

  <!-- Central Chip Body -->
  <rect x="20" y="20" width="24" height="24" rx="5" fill="url(#coreGrad)" filter="url(#glow)" />
  <rect x="23" y="23" width="18" height="18" rx="3" fill="#0f172a" />
  
  <!-- Central Pulse / Waveform -->
  <path d="M 25 32 H 28 L 30 27 L 33 37 L 36 29 L 38 32 H 41" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
