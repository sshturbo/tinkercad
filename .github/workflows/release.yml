name: Build and release desktop apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versão a publicar (ex.: v0.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: msi,nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: CircuitLab Offline ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Instaladores do CircuitLab Offline para Windows e Linux.

            Os arquivos desta release foram compilados automaticamente pelo GitHub Actions.
          releaseDraft: false
          prerelease: false
